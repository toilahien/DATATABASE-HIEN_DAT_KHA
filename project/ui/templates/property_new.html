{% extends 'base.html' %}{% block title %}Add property{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">PORTFOLIO</p><h1>Add property</h1><p class="muted">Create a property and its corresponding details.</p></div><a class="button secondary" href="{{url_for('properties')}}">← Back</a></div>
<section class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Title<input name="title" maxlength="150" required></label><label>Address<input name="address" maxlength="255" required></label>
<label>Property type<select name="property_type" id="property_type" onchange="toggleSubtype()"><option value="RESIDENTIAL">Residential</option><option value="COMMERCIAL">Commercial</option></select></label>
<label>Listing type<select name="listing_type"><option value="FOR_RENT">For rent</option><option value="FOR_SALE">For sale</option></select></label>
<label>Asking price (VND)<input type="number" name="asking_price" min="1" step="1" required></label>
<label>Owner<select name="owner_id" required><option value="">Select an owner</option>{% for o in owners %}<option value="{{o.person_id}}">#{{o.person_id}} · {{o.full_name}}</option>{% endfor %}</select></label>
<label>Assigned agent<select name="agent_id" required><option value="">Select an agent</option>{% for a in agents %}<option value="{{a.person_id}}">#{{a.person_id}} · {{a.full_name}}</option>{% endfor %}</select></label>
<div class="subtype-fields" id="residential_fields"><h3>Residential details</h3><div class="form-grid"><label>Bedrooms<input type="number" name="bedrooms" min="0" value="2"></label><label>Bathrooms<input type="number" name="bathrooms" min="0" value="1"></label><label>Area (m²)<input type="number" name="area_sqm" min="0.01" step="0.01" value="70"></label><label>Furnishing<select name="furnished_status"><option value="">Not specified</option><option value="FURNISHED">Furnished</option><option value="PARTLY_FURNISHED">Partly furnished</option><option value="UNFURNISHED">Unfurnished</option></select></label></div></div>
<div class="subtype-fields" id="commercial_fields" hidden><h3>Commercial details</h3><div class="form-grid"><label>Business type<input name="business_type" maxlength="60"></label><label>Floor area (m²)<input type="number" name="floor_area_sqm" min="0.01" step="0.01" value="100"></label><label>Parking spaces<input type="number" name="parking_spaces" min="0" value="0"></label></div></div>
<div class="form-actions"><button class="button" type="submit">Save property</button></div></form></section>
<script>function toggleSubtype(){const residential=document.getElementById('property_type').value==='RESIDENTIAL';document.getElementById('residential_fields').hidden=!residential;document.getElementById('commercial_fields').hidden=residential;document.querySelectorAll('#residential_fields input,#residential_fields select').forEach(e=>e.disabled=!residential);document.querySelectorAll('#commercial_fields input,#commercial_fields select').forEach(e=>e.disabled=residential)}toggleSubtype();</script>
{% endblock %}
