{% extends 'base.html' %}{% block title %}Initial setup{% endblock %}{% block content %}
<div class="auth-wrap"><section class="panel auth-panel"><p class="eyebrow">FIRST TIME SETUP</p><h1>Create Admin account</h1><p class="muted">This one-time setup is available only while the database has no Admin account.</p>
<form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="wide">Username<input name="username" minlength="3" maxlength="80" autocomplete="username" required autofocus></label><label class="wide">Password<input type="password" name="password" maxlength="128" autocomplete="new-password" required><small>Maximum 128 characters.</small></label><label class="wide">Confirm password<input type="password" name="confirm_password" maxlength="128" autocomplete="new-password" required></label><div class="form-actions"><button class="button" type="submit">Create Admin</button></div></form></section></div>
{% endblock %}
