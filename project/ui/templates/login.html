{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}
<div class="auth-wrap"><section class="panel auth-panel"><p class="eyebrow">REIMS ACCOUNT</p><h1>Sign in</h1><p class="muted">Use the account provided for your project role.</p>
<form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="wide">Username<input name="username" autocomplete="username" required autofocus></label><label class="wide">Password<input type="password" name="password" autocomplete="current-password" required></label><div class="form-actions"><button class="button" type="submit">Sign in</button></div></form></section></div>
{% endblock %}
